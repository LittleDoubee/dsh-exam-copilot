<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>模拟考试 · 单页考试系统（本地测试页）</title>
<!--
  这是 dsh-exam-copilot 的 S1 验收页，刻意做成"看起来像真实考试系统"：

  为什么用它而不是直接拿真实考试界面：
    * 可控 —— 题目、布局、题号格式都可自定，能精确复现问题
    * 可重复 —— 每次刷新回到第 1 题，回归测试才有意义
    * 无风险 —— 不碰任何真实业务，误点也不会有后果

  它覆盖了自动化最容易踩的四类情形：
    1. 题号 "4/12" 埋在左下角（翻页验证的唯一可靠依据，不能用像素哈希）
    2. 选项字母与正文紧贴（"A对情节严重…"，v1 解析器就栽在这）
    3. 题目高度不一致 —— 有的需要滚动才能看全选项
    4. 图形题 —— OCR 完全无效，必须走视觉通道
-->
<style>
	:root {
		--bg: #f4f5f7;
		--panel: #fff;
		--ink: #1a1d21;
		--dim: #6b7280;
		--line: #e3e6ea;
		--blue: #2f6bff;
		--green: #14a44d;
		--amber: #e0a800;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font: 15px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
		background: var(--bg);
		color: var(--ink);
	}
	.exam {
		max-width: 960px;
		margin: 28px auto 80px;
		background: var(--panel);
		border: 1px solid var(--line);
		border-radius: 12px;
		overflow: hidden;
		/* 高度锁死：让页脚（题号 + 翻页按钮）永远停在同一个 y 坐标。
		   每次「翻页失败」的现象相同但根因都不同：
		     ① auto 高度 → 短题页脚往上跑（第 1 题 y=479，第 3 题 y=362）
		     ② min-height:620 → 图形题内容 676 更高，页脚又下移到 651
		     ③ height:620 + 内容区内部滚动 → 图形题的第 4 个选项 D 被切掉
		        13px（D 在 y=543..593，内容区底边 580），OCR 只读到 A,B。
		        注意这一条**扩大识别区域救不了** —— 滚出可视区的像素
		        在屏幕上根本不存在，OCR 截不到。
		   所以最终方案取 680px：实测 12 题里最高的图形题需要 676，
		   取 680 让全部题目都在视口内、无需滚动、页脚恒定。
		   真实考试系统（法考等）也是固定页脚 + 固定高度。
		   测试环境更必须有确定性：位置每题都变，回归就没有基线。
		   若日后加了更长的题，先在 json 里确认它不超过这个高度，
		   或者专门为「滚动补全」另建一题（不要让它污染这 12 题基线）。 */
		height: 680px;
		display: flex;
		flex-direction: column;
	}
	/* 内容区吃掉剩余高度。
	   保留 overflow-y:auto 作为兜底（万一有题超长，页面不崩、内容可滚），
	   但 680px 下这 12 题都装得下，实际不会出现滚动条。
	   scrollbar-gutter:stable 保证万一出现滚动条时文字不横向位移。 */
	.body {
		flex: 1 1 auto;
		overflow-y: auto;
		scrollbar-gutter: stable;
		padding: 26px 30px 34px;
	}
	/* 顶栏：倒计时 + 题型标签。倒计时条同时充当题面区上边界（parser 靠它切掉浏览器 chrome） */
	.bar {
		display: flex;
		align-items: center;
		gap: 16px;
		padding: 14px 24px;
		background: linear-gradient(90deg, #0d9488, #0f766e);
		color: #fff;
		font-size: 14px;
	}
	.bar .spacer { flex: 1; }
	.bar .timer { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .5px; }
	/* 题面区：独立容器，方便圈选时只框这一块 */
	.qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
	.qtype {
		font-size: 12px;
		padding: 2px 9px;
		border-radius: 5px;
		background: #eef2ff;
		color: #3b5bdb;
		white-space: nowrap;
	}
	.stem { font-size: 16px; line-height: 1.9; }
	.opts { margin-top: 18px; }
	/* 关键：字母与正文紧贴，不加空格 —— 复现真实考卷里 v1 解析器的失败场景 */
	.opt {
		display: flex;
		gap: 8px;
		padding: 11px 14px;
		margin-bottom: 9px;
		border: 1px solid var(--line);
		border-radius: 9px;
		cursor: pointer;
		transition: background .12s, border-color .12s;
	}
	.opt:hover { background: #f7f9fc; }
	.opt.on { background: #e7f5ec; border-color: var(--green); }
	.opt .letter { font-weight: 600; min-width: 18px; }
	.figure { margin: 16px 0; padding: 12px; border: 1px dashed var(--line); border-radius: 9px; background: #fbfcfe; }
	.figure svg { display: block; margin: 0 auto; }
	/* 底部状态栏：题号在最左，翻页按钮在最右（真实布局） */
	.foot {
		display: flex;
		align-items: center;
		gap: 12px;
		padding: 14px 24px;
		border-top: 1px solid var(--line);
		background: #fbfcfd;
	}
	.prog { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }
	.foot .spacer { flex: 1; }
	button {
		padding: 8px 20px;
		border-radius: 8px;
		border: 1px solid var(--line);
		background: #fff;
		color: var(--ink);
		font-size: 14px;
		cursor: pointer;
	}
	button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 500; }
	button.submit { background: #fff; border-color: var(--amber); color: #a16207; }
	button:disabled { opacity: .45; cursor: not-allowed; }
	.done { padding: 60px 30px; text-align: center; }
	.done h2 { margin: 0 0 10px; }
</style>
</head>
<body>

<div class="exam">
	<div class="bar">
		<span>模拟考试系统</span>
		<span class="spacer"></span>
		<span>剩余时间</span>
		<span class="timer" id="timer">45:00</span>
	</div>

	<div class="body" id="qbody">
		<div class="qhead">
			<span class="qtype" id="qtype">单选题</span>
		</div>
		<div class="stem" id="stem">加载中…</div>
		<div id="figure"></div>
		<div class="opts" id="opts"></div>
	</div>

	<div class="foot">
		<span class="prog" id="prog">1/12</span>
		<span class="spacer"></span>
		<button id="prev">上一题</button>
		<button id="next" class="primary">下一题</button>
		<button id="submit" class="submit">交卷</button>
	</div>
</div>

<script>
	// 题库刻意覆盖四类题型与三种布局难度：
	//   单选/多选/判断 —— 常规可选
	//   图形题 —— 只有图，OCR 读不出内容（验证"必须走视觉通道"）
	//   长题 —— 题干很长，选项会溢出到需要滚动
	const QUESTIONS = [
		{
			type: '单选题',
			stem: '根据《印刷业管理条例》，从事出版物印刷经营活动的企业，应当取得下列哪项许可？',
			options: ['A印刷经营许可证', 'B出版物经营许可证', 'C特种行业许可证', 'D营业执照即可'],
			answer: 'A',
		},
		{
			type: '多选题',
			stem: '下列哪些属于出版物印刷企业应当建立的内部管理制度？',
			options: [
				'A承印验证制度',
				'B承印登记制度',
				'C印刷品保管制度',
				'D印刷活动残次品销毁制度',
			],
			answer: 'ABCD',
		},
		{
			type: '判断题',
			stem: '印刷企业接受委托印刷境外出版物，无需向所在地出版行政部门备案。',
			options: ['A正确', 'B错误'],
			answer: 'B',
		},
		{
			type: '单选题',
			// 长题干：验证滚动拼接（选项会被挤出视口）
			stem:
				'某印刷企业在承接一批内部资料性出版物印刷业务时，委托方未能提供完整的准印证材料，该企业负责人认为只要双方签订书面合同即可承印。' +
				'关于该情形的处理，下列说法中正确的是：',
			options: [
				'A可以先承印，事后补齐材料即可',
				'B应当拒绝承印，并说明理由',
				'C可以承印但需在十日内报备',
				'D只需留存合同副本备查',
			],
			answer: 'B',
		},
		{
			type: '单选题',
			stem: '下图所示流程图中，缺失的环节应当是：',
			// 图形题：OCR 无法读出流程内容，只能靠视觉模型
			figure:
				'<svg width="420" height="130" viewBox="0 0 420 130">' +
				'<rect x="8" y="45" width="104" height="42" rx="7" fill="#eef2ff" stroke="#3b5bdb"/>' +
				'<text x="60" y="71" text-anchor="middle" font-size="13" fill="#1a1d21">承印验证</text>' +
				'<line x1="112" y1="66" x2="150" y2="66" stroke="#6b7280" stroke-width="2"/>' +
				'<polygon points="150,66 142,61 142,71" fill="#6b7280"/>' +
				'<rect x="156" y="45" width="104" height="42" rx="7" fill="#fff" stroke="#e0a800" stroke-dasharray="5 4"/>' +
				'<text x="208" y="71" text-anchor="middle" font-size="13" fill="#a16207">? ? ?</text>' +
				'<line x1="260" y1="66" x2="298" y2="66" stroke="#6b7280" stroke-width="2"/>' +
				'<polygon points="298,66 290,61 290,71" fill="#6b7280"/>' +
				'<rect x="304" y="45" width="104" height="42" rx="7" fill="#eef2ff" stroke="#3b5bdb"/>' +
				'<text x="356" y="71" text-anchor="middle" font-size="13" fill="#1a1d21">交付印刷</text>' +
				'</svg>',
			options: ['A承印登记', 'B排版设计', 'C成本核算', 'D市场推广'],
			answer: 'A',
		},
		{
			type: '单选题',
			stem: '印刷经营许可证的有效期一般为：',
			options: ['A一年', 'B三年', 'C五年', 'D长期有效'],
			answer: 'C',
		},
		{
			type: '多选题',
			stem: '出版物印刷企业不得印刷下列哪些内容？',
			options: ['A含有法律禁止内容的出版物', 'B未经批准的内部资料', 'C境外出版物', 'D假冒他人署名的作品'],
			answer: 'ABD',
		},
		{
			type: '判断题',
			stem: '印刷企业可以将承印业务转委托给其他印刷企业完成。',
			options: ['A正确', 'B错误'],
			answer: 'B',
		},
		{
			type: '单选题',
			stem: '下列哪项不属于承印验证制度要求核验的材料？',
			options: ['A营业执照', 'B准印证', 'C法定代表人身份证原件', 'D著作权授权证明'],
			answer: 'C',
		},
		{
			type: '多选题',
			stem: '关于印刷品保管制度，下列说法正确的有：',
			options: ['A应当分类存放', 'B应当建立台账', 'C可以随意处置残次品', 'D应当留存备查'],
			answer: 'ABD',
		},
		{
			type: '单选题',
			stem: '违反印刷业管理规定，情节严重的，出版行政部门可以采取的措施是：',
			options: ['A仅口头警告', 'B吊销印刷经营许可证', 'C罚款五十元', 'D不予处理'],
			answer: 'B',
		},
		{
			type: '判断题',
			stem: '印刷企业应当配合出版行政部门的监督检查，如实提供有关材料。',
			options: ['A正确', 'B错误'],
			answer: 'A',
		},
	];

	let idx = 0;
	const answers = {};

	const el = (id) => document.getElementById(id);

	function render() {
		const q = QUESTIONS[idx];
		el('qtype').textContent = q.type;
		el('stem').textContent = (idx + 1) + '. ' + q.stem;

		// 图形题：只有图形存在时才渲染容器
		if (q.figure) {
			el('figure').innerHTML = '<div class="figure">' + q.figure + '</div>';
		} else {
			el('figure').innerHTML = '';
		}

		const box = el('opts');
		box.innerHTML = '';
		q.options.forEach((text) => {
			// 字母与正文紧贴：这是真实考卷的排版，也是解析器的难点
			const letter = text.slice(0, 1);
			const body = text.slice(1);
			const div = document.createElement('div');
			div.className = 'opt' + (answers[idx] && answers[idx].includes(letter) ? ' on' : '');
			div.innerHTML = '<span class="letter">' + letter + '</span><span>' + body + '</span>';
			div.addEventListener('click', () => toggle(letter));
			box.appendChild(div);
		});

		el('prog').textContent = (idx + 1) + '/' + QUESTIONS.length;
		el('prev').disabled = idx === 0;
		el('next').textContent = idx === QUESTIONS.length - 1 ? '完成' : '下一题';
	}

	function toggle(letter) {
		const q = QUESTIONS[idx];
		const multi = q.type === '多选题';
		if (multi) {
			const cur = (answers[idx] || '').split('').filter(Boolean);
			const i = cur.indexOf(letter);
			if (i >= 0) cur.splice(i, 1);
			else cur.push(letter);
			answers[idx] = cur.sort().join('');
		} else {
			// 单选/判断：再点一次取消
			answers[idx] = answers[idx] === letter ? '' : letter;
		}
		render();
	}

	el('prev').addEventListener('click', () => {
		if (idx > 0) {
			idx--;
			render();
		}
	});
	el('next').addEventListener('click', () => {
		if (idx < QUESTIONS.length - 1) {
			idx++;
			render();
		} else {
			finish();
		}
	});
	el('submit').addEventListener('click', finish);

	function finish() {
		let right = 0;
		QUESTIONS.forEach((q, i) => {
			if ((answers[i] || '') === q.answer) right++;
		});
		document.querySelector('.exam').innerHTML =
			'<div class="done"><h2>已交卷</h2>' +
			'<p style="color:#6b7280">得分 ' + right + ' / ' + QUESTIONS.length + '</p>' +
			'<p style="color:#9ca3af;font-size:13px">刷新页面可重新开始（回归测试依赖这一点）</p></div>';
	}

	// 倒计时：真实考试都有，且它是 parser 切掉 chrome 的上边界锚点
	let left = 45 * 60;
	setInterval(() => {
		left = Math.max(0, left - 1);
		const m = String(Math.floor(left / 60)).padStart(2, '0');
		const s = String(left % 60).padStart(2, '0');
		const t = el('timer');
		if (t) t.textContent = m + ':' + s;
	}, 1000);

	render();
</script>

</body>
</html>
